<svg xmlns="http://www.w3.org/2000/svg" width="760" height="521" viewBox="0 0 760 521" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<rect width="760" height="521" rx="8" fill="#11161c"/>
<rect width="760" height="34" rx="8" fill="#1b222b"/><rect y="26" width="760" height="8" fill="#1b222b"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/>
<circle cx="38" cy="17" r="6" fill="#febc2e"/>
<circle cx="56" cy="17" r="6" fill="#28c840"/>
<text x="380.0" y="22" fill="#7c8896" font-size="12" text-anchor="middle">secureapi-lab</text>
<text x="26" y="58" fill="#8fd3ff" font-weight="600" xml:space="preserve">$ ./attacks/key_idor.sh</text>
<text x="26" y="79" fill="#8b98a5" xml:space="preserve">  attacker probes an API key owned by another user, 12 times</text>
<text x="26" y="121" fill="#ff8a80" xml:space="preserve">  403  403  403  403  403  403  403  403  403  403  403  403</text>
<text x="26" y="142" fill="#8b98a5" xml:space="preserve">  every attempt rejected, and written to security_events as AUTHZ_IDOR</text>
<text x="26" y="184" fill="#8b98a5" xml:space="preserve">  waiting for the scheduled sweep ...</text>
<text x="26" y="226" fill="#8fd3ff" font-weight="600" xml:space="preserve">$ curl -s localhost:8080/api/alerts -H "X-API-Key: $KEY"</text>
<text x="26" y="268" fill="#d7dee6" xml:space="preserve">  [</text>
<text x="26" y="289" fill="#d7dee6" xml:space="preserve">    {</text>
<text x="26" y="310" fill="#79b8ff" xml:space="preserve">      "ruleName":      </text>
<text x="206" y="310" fill="#9ae6b4" xml:space="preserve">"KEY_IDOR",</text>
<text x="26" y="331" fill="#79b8ff" xml:space="preserve">      "severity":      </text>
<text x="206" y="331" fill="#9ae6b4" xml:space="preserve">"HIGH",</text>
<text x="26" y="352" fill="#79b8ff" xml:space="preserve">      "fingerprint":   </text>
<text x="206" y="352" fill="#9ae6b4" xml:space="preserve">"KEY_IDOR:2:2026-08-25T06:45:00Z",</text>
<text x="26" y="373" fill="#79b8ff" xml:space="preserve">      "suppressUntil": </text>
<text x="206" y="373" fill="#9ae6b4" xml:space="preserve">"2026-08-25T07:01:59Z",</text>
<text x="26" y="394" fill="#79b8ff" xml:space="preserve">      "acknowledgedAt":</text>
<text x="206" y="394" fill="#9ae6b4" xml:space="preserve">null</text>
<text x="26" y="415" fill="#d7dee6" xml:space="preserve">    }</text>
<text x="26" y="436" fill="#d7dee6" xml:space="preserve">  ]</text>
<text x="26" y="478" fill="#7fdba4" font-weight="600" xml:space="preserve">  12 rejected requests  -&gt;  1 correlated alert</text>
</svg>