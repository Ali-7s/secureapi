server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/secureapi
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jdbc:
    template:
      query-timeout: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}
  refresh:
    secret: ${JWT_REFRESH_SECRET}

detection:
  scan-interval-ms: 10000
lockout:
  threshold: 10
  window: PT15M
  duration: PT15M
rate-limit:
  capacity: 20
  refill-period: PT1M

